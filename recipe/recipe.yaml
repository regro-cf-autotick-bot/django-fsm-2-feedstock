# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.3.0"

package:
  name: django-fsm-2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-fsm-2/django_fsm_2-${{ version }}.tar.gz
  sha256: 1e47a4b29904c201df16a68208f8e337db826df1488670447d5d0ade87ae7d7f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - django-stubs-ext
    - django >=4.2.29
    - typing_extensions

tests:
  - python:
      imports:
        - django_fsm
        - fsm_admin
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/django-commons/django-fsm-2
  license: MIT
  license_file: LICENSE
  summary: Django friendly finite state machine support.
  description: |
    Django friendly finite state machine support.
  repository: https://github.com/django-commons/django-fsm-2
  documentation: https://github.com/django-commons/django-fsm-2

extra:
  recipe-maintainers:
    - rxm7706
